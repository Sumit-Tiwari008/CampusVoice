<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Login - CampusVoice</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">Campus<span>Voice</span></a>
        
        <div class="nav-buttons">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
            <a href="login.html" class="btn btn-ghost">Log In</a>
            <a href="register.html" class="btn btn-pill">Sign Up</a>
        </div>
    </header>

    <!-- ===== AUTH SECTION ===== -->
    <main class="auth-section">
        <div class="auth-glow glow-top"></div>
        <div class="auth-glow glow-bottom"></div>

        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-sub">Log in to report and track campus issues.</p>
            
            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="xyz@xyz.edu" required>
                
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot?</a>
                </div>
                <input type="password" id="password" placeholder="••••••" required>
                
                <button type="submit" class="btn btn-pill btn-full">Log In</button>
            </form>

            <div class="auth-switch">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 CampusVoice — Smart College Issue Management System</p>
        <p class="credit-tag">Designed & Developed by <span class="credit-name">SUMIT TIWARI</span></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
