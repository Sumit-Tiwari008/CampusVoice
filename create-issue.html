```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - CampusVoice</title>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">
            Campus<span>Voice</span>
        </a>

        <div class="nav-buttons">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
            <a href="dashboard.html" class="btn btn-ghost">Back</a>
        </div>
    </header>

    <!-- ===== REPORT ISSUE SECTION ===== -->
    <main class="auth-section">

        <div class="auth-card">

            <h1>Report an Issue</h1>
            <p class="auth-sub">
                Tell us about a problem on campus.
            </p>

            <form id="createIssueForm">

                <label for="issueTitle">Issue Title</label>
                <input
                    type="text"
                    id="issueTitle"
                    placeholder="Enter issue title"
                    required
                >

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="wifi">Wi-Fi</option>
                    <option value="hostel">Hostel</option>
                    <option value="mess">Mess</option>
                    <option value="academics">Academics</option>
                    <option value="other">Other</option>
                </select>

                <label for="location">Location</label>
                <input
                    type="text"
                    id="location"
                    placeholder="Enter location"
                    required
                >

                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    placeholder="Describe the issue"
                    required
                >

                <label for="issueImage">Upload Image</label>
                <input
                    type="file"
                    id="issueImage"
                    accept="image/*"
                >

                <label>Visibility</label>

                <div class="visibility-options">
                    <label>
                        <input
                            type="radio"
                            name="visibility"
                            value="public"
                            checked
                        >
                        Public
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="visibility"
                            value="private"
                        >
                        Private
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="visibility"
                            value="admin"
                        >
                        Admin Only
                    </label>
                </div>

                <button
                    type="submit"
                    class="btn btn-pill btn-full"
                >
                    Submit Issue
                </button>

            </form>

        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 CampusVoice — Smart College Issue Management System</p>
        <p class="credit-tag">
            Designed & Developed by
            <span class="credit-name">SUMIT TIWARI</span>
        </p>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
```
